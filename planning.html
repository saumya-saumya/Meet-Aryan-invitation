<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning updates · Meet Aryan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9CBEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#A9CBEA;--blue-soft:#D6E7F6;--blue-mist:#EEF5FB;--navy:#2C4A7C;--navy-ink:#1F3560;--cream:#FBF5E8;--cream-deep:#F3E8D0;--gold:#C79A3B;--gold-light:#E6C77A;--text:#2B3A55;--muted:#5F6F8A;--radius:22px;--shadow:0 10px 30px rgba(44,74,124,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:var(--blue-mist);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;color:var(--navy-ink);line-height:1.1}
a{color:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
.eyebrow{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;text-align:center;margin-bottom:10px}
h2{font-size:clamp(2rem,5vw,2.8rem);text-align:center;font-weight:600}
.lead{max-width:620px;margin:14px auto 0;text-align:center;color:var(--muted)}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 36px;color:var(--gold)}
.divider::before,.divider::after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold-light))}
.divider::after{transform:scaleX(-1)}
nav{position:sticky;top:0;z-index:20;background:rgba(251,245,232,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--cream-deep)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none;justify-content:safe center}
nav .wrap::-webkit-scrollbar{display:none}
@media(max-width:700px){nav .wrap{justify-content:flex-start}}
nav a{white-space:nowrap;text-decoration:none;font-size:.85rem;font-weight:700;color:var(--navy);padding:6px 14px;border-radius:999px}
nav a:hover{background:var(--blue-soft)}
.hero{position:relative;overflow:hidden;text-align:center;padding:84px 0 92px;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.4),transparent 40%),var(--blue)}
.hero .pattern{position:absolute;inset:0;opacity:.09;pointer-events:none}
.sticker{width:170px;height:170px;border-radius:50%;background:var(--cream);margin:0 auto 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.7)}
.sticker span{font-family:'Cormorant Garamond',serif;font-size:1.65rem;font-weight:600;color:var(--navy-ink);line-height:1.1}
.hero h1{font-size:clamp(3.4rem,13vw,6.6rem);font-weight:600;color:var(--navy-ink);letter-spacing:.01em}
.hero h1 em{font-style:italic;color:var(--navy)}
.hero .sub{font-size:1.1rem;color:var(--navy-ink);margin-top:10px;font-weight:600}
.date-pill{display:inline-block;margin-top:28px;background:var(--cream);color:var(--navy-ink);border-radius:999px;padding:14px 30px;font-weight:700;box-shadow:var(--shadow);border:1.5px solid var(--gold-light);font-size:1.02rem}
.date-pill b{color:var(--gold)}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:13px 28px;border-radius:999px;border:2px solid var(--navy);color:var(--navy);background:transparent;cursor:pointer;font-family:inherit;font-size:.98rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--navy);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.floaty{position:absolute;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.floaty{animation:bob 7s ease-in-out infinite}.floaty.b{animation-delay:-3s}}
@keyframes bob{50%{transform:translateY(-10px)}}
@media(max-width:600px){.floaty{opacity:.55}}
.hosts{margin-top:10px;font-weight:600;color:var(--navy-ink)}
.count{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.count div{background:var(--cream);border-radius:18px;padding:12px 8px;width:82px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--gold-light)}
.count b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--navy-ink);line-height:1}
.count small{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--cream);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);border:1px solid var(--cream-deep)}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.icon{width:46px;height:46px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.icon svg{width:24px;height:24px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.6rem;margin-bottom:6px}
.card p{color:var(--muted)}
.card .big{font-weight:700;color:var(--text);font-size:1.05rem}
.map-link{display:inline-block;margin-top:12px;font-weight:700}
.thanks{max-width:430px;margin:0 auto;background:var(--cream);border-radius:20px;text-align:center;padding:38px 30px;box-shadow:var(--shadow);border:1px solid var(--cream-deep)}
.thanks p.q{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--navy-ink);line-height:1.3}
.thanks .heart{color:var(--gold);margin-top:10px;font-size:1.1rem}
.thanks .small{font-size:.95rem;color:var(--muted);margin-top:14px}
.alt{background:var(--cream-deep)}
.board{display:grid;gap:12px;max-width:820px;margin:0 auto}
.item{background:var(--cream);border-radius:18px;padding:16px 20px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--cream-deep);box-shadow:0 4px 14px rgba(44,74,124,.07)}
.num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--blue);color:var(--navy-ink);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
.item .body{flex:1;min-width:0}
.item h3{font-family:'Nunito',sans-serif;font-size:1.02rem;font-weight:700;color:var(--navy-ink)}
.item p{font-size:.92rem;color:var(--muted);margin-top:2px}
.chip{flex:0 0 auto;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px;white-space:nowrap}
.chip.done{background:#DCEBD6;color:#3C6B35}.chip.progress{background:var(--blue-soft);color:var(--navy)}.chip.todo{background:var(--cream-deep);color:#8A6A1F}
.progressbar{max-width:820px;margin:0 auto 22px;background:var(--cream);border-radius:999px;height:12px;overflow:hidden;border:1px solid var(--cream-deep)}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold-light));width:0;transition:width .8s}
.pcap{text-align:center;font-size:.88rem;color:var(--muted);margin-bottom:18px;font-weight:600}
@media(max-width:520px){.item{flex-wrap:wrap}.chip{margin-left:54px}}
.tl{position:relative;max-width:640px;margin:0 auto;padding-left:30px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--gold-light))}
.tl .step{position:relative;margin-bottom:26px}
.tl .step::before{content:"";position:absolute;left:-30px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--cream);border:3px solid var(--gold)}
.tl h3{font-family:'Nunito',sans-serif;font-size:1rem;color:var(--navy-ink);font-weight:800}
.tl p{color:var(--muted);font-size:.95rem}
.video{max-width:640px;margin:34px auto 0;aspect-ratio:16/9;border-radius:var(--radius);background:var(--blue-soft);border:2px dashed var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--navy);padding:20px;font-weight:700;overflow:hidden}
.video iframe{width:100%;height:100%;border:0}
footer{text-align:center;padding:50px 20px 60px;background:var(--blue);color:var(--navy-ink)}
footer .sig{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600}
footer p{font-weight:600;margin-top:6px}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
/* motif strip */
.motifs{display:flex;justify-content:center;gap:clamp(10px,3vw,26px);margin-top:30px;flex-wrap:wrap}
.motifs svg{width:clamp(54px,12vw,84px);height:auto}
/* game */
.gamebar{display:flex;justify-content:center;gap:18px;align-items:center;margin-bottom:18px;font-weight:700;color:var(--navy-ink);flex-wrap:wrap}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:440px;margin:0 auto}
.mcard{aspect-ratio:1;perspective:600px;border:0;background:none;cursor:pointer;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;display:block}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .bk{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(44,74,124,.15)}
.mcard .bk{background:var(--blue);border:3px solid var(--cream)}
.mcard .bk::after{content:"?";font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--navy);font-weight:700}
.mcard .f{background:var(--cream);border:3px solid var(--gold-light);transform:rotateY(180deg)}
.mcard .f svg{width:72%;height:72%}
.mcard.match .f{background:#fff;border-color:var(--gold)}
.win{text-align:center;margin-top:20px;font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--navy-ink);min-height:2em}

</style>
</head>
<body>

window.motif=(id,extra)=>`<svg viewBox="0 0 100 90" ${extra||""} aria-hidden="true"><use href="#m-${id}"/></svg>`;

<header class="hero" style="padding:56px 0 60px">
  <div class="wrap" style="position:relative">
    <div class="motifs" id="m" style="margin:0 0 14px"></div>
    <p class="sub" style="font-size:.8rem;letter-spacing:.28em;text-transform:uppercase">Family planning board</p>
    <h1 style="font-size:clamp(2.6rem,9vw,4.4rem)">Meet <em>Aryan</em></h1>
    <p class="sub">Saturday, December 19 · 12–4 PM · Allen, Texas</p>
    <p class="hosts">Hosts: Nupur Jha (Mom) &amp; Sanchal Ranjan (Dad)</p>
  </div>
</header>
<section style="padding-top:48px">
  <div class="wrap">
    <h2>Where we are</h2>
    <p class="lead">For the family helping plan the day. Guests only need the invite page.</p>
    <div class="divider">✦</div>
    <p class="pcap" id="pcap"></p>
    <div class="progressbar"><i id="pbar"></i></div>
    <div class="board" id="board"></div>
    <div class="cta-row"><a class="btn" href="index.html">View the invitation</a></div>
  </div>
</section>
<footer><div class="sig">With love, Aryan &amp; family</div></footer>
<script>
/* status: "done" | "progress" | "todo" . Edit, save, redeploy. */
const PLANS = [
  { t: "Overall theme and colours", s: "progress", n: "Powder blue, cream, grey-blue and silver, with a teddy bear, balloons and a cradle. Little booties, hats and boots only as small accents." },
  { t: "E-invitation and video invite", s: "progress", n: "Invitation site is built. Short video invite still to come." },
  { t: "Calling guests (Nupur and Sanchal)", s: "todo", n: "Personal calls to family and friends." },
  { t: "RSVP list", s: "todo", n: "Google Form link to be added to the invite." },
  { t: "Location", s: "done", n: "At home, 1138 Amy Drive, Allen, Texas." },
  { t: "Decor (theme and decorator)", s: "progress", n: "Inspiration chosen: a powder-blue, cream and silver balloon cluster floating a teddy bear on a white balloon cloud. Decorator and quote still to be finalised." },
  { t: "Aryan's timeline, video and song", s: "todo", n: "Photos, a short film and a song for the day." },
  { t: "Baby registry", s: "todo", n: "Registry link to be added to the invite." }
];
const LABEL={done:"Done",progress:"In progress",todo:"To do"};
document.getElementById("m").innerHTML=motif("balloons")+motif("cradle")+motif("bear")+["bootie","hat","boot"].map(k=>motif(k,'style="width:40px"')).join("");
const board=document.getElementById("board");
PLANS.forEach((p,i)=>{ const d=document.createElement("div"); d.className="item";
  d.innerHTML=`<div class="num">${i+1}</div><div class="body"><h3></h3><p></p></div><span class="chip ${p.s}">${LABEL[p.s]}</span>`;
  d.querySelector("h3").textContent=p.t; d.querySelector("p").textContent=p.n; board.appendChild(d); });
const done=PLANS.filter(p=>p.s==="done").length, prog=PLANS.filter(p=>p.s==="progress").length;
document.getElementById("pcap").textContent=`${done} done · ${prog} in progress · ${PLANS.length-done-prog} to do`;
requestAnimationFrame(()=>document.getElementById("pbar").style.width=Math.round((done+prog*.5)/PLANS.length*100)+"%");
</script>
</body>
</html>
